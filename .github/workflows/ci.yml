name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Mesa's software Vulkan driver (lavapipe) runs the headless render tests.
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      # OpenSKP's Python package, the reference the .skp reader is compared against.
      # Same commit as the Rust port (see tools/README.md).
      - run: pip install "openskp @ git+https://github.com/iamahsanmehmood/openskp@359d1836c9665484c193635796a54aef004babac#subdirectory=packages/python"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # mt-cuda loads CUDA at run time, so the feature builds without a toolkit; the GPU
      # tests skip without a device.
      - run: cargo clippy -p mt-cuda --all-targets --features cuda
      - run: cargo test -p mt-cuda --features cuda

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets
      # Headless render tests use whatever adapter exists (WARP on DX12) or skip;
      # the OpenSKP oracle tests skip without the Python package.
      - run: cargo test --workspace
      # A release binary to try on Windows, with the CUDA pick index (loaded at run
      # time; the app falls back to the CPU without an NVIDIA driver).
      - run: cargo build --release -p mt-app --features cuda
      - uses: actions/upload-artifact@v4
        with:
          name: meshtard-windows-x64
          path: target/release/meshtard.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # No CUDA on macOS.
      - run: cargo build --release -p mt-app
      - uses: actions/upload-artifact@v4
        with:
          name: meshtard-macos-arm64
          path: target/release/meshtard
