name: Release

# Publishes a GitHub release with the Windows, macOS and Linux binaries and
# docs/releases/<tag>.md as the notes. Three ways to start it:
# - automatically: when CI passes on the release branch and the workspace version
#   (Cargo.toml) has no release yet but has its notes file, that commit is released
#   as v<version>;
# - pushing a tag like v0.1.0;
# - by hand (Run workflow) with a tag name and optionally a commit.
# Tags with a hyphen (v0.2.0-rc1) and 0.x versions are marked as pre-releases.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [claude/sketchup-reverse-engineer-plan-j209rc]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.1.0"
        required: true
      sha:
        description: "Commit to build (optional; default: the branch head)"
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  decide:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.d.outputs.tag }}
      sha: ${{ steps.d.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
      - id: d
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CI_RESULT: ${{ github.event.workflow_run.conclusion }}
          CI_EVENT: ${{ github.event.workflow_run.event }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          IN_TAG: ${{ inputs.tag }}
          IN_SHA: ${{ inputs.sha }}
        run: |
          case "$EVENT" in
            workflow_run)
              [ "$CI_RESULT" = success ] && [ "$CI_EVENT" = push ] || { echo "CI not a green push"; exit 0; }
              ver=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
              tag="v$ver"
              [ -f "docs/releases/$tag.md" ] || { echo "no notes for $tag"; exit 0; }
              if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                echo "$tag already released"; exit 0
              fi
              sha="$RUN_SHA" ;;
            workflow_dispatch) tag="$IN_TAG"; sha="${IN_SHA:-$GITHUB_SHA}" ;;
            *) tag="$GITHUB_REF_NAME"; sha="$GITHUB_SHA" ;;
          esac
          echo "releasing $tag from $sha"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    needs: decide
    if: needs.decide.outputs.tag != ''
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: meshtard-windows-x64
            features: --features cuda
          - os: macos-latest
            name: meshtard-macos-arm64
            features: ""
          - os: ubuntu-24.04
            name: meshtard-linux-x64
            features: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p mt-app ${{ matrix.features }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/${{ matrix.name }} | Out-Null
          Copy-Item target/release/meshtard.exe, LICENSE*, README* dist/${{ matrix.name }}/ -ErrorAction SilentlyContinue
          Compress-Archive -Path dist/${{ matrix.name }} -DestinationPath ${{ matrix.name }}.zip
      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.name }}
          cp target/release/meshtard dist/${{ matrix.name }}/
          cp LICENSE* README* dist/${{ matrix.name }}/ 2>/dev/null || true
          tar -C dist -czf ${{ matrix.name }}.tar.gz ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*

  release:
    needs: [decide, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.decide.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.decide.outputs.tag }}
          TARGET: ${{ needs.decide.outputs.sha }}
        run: |
          notes="docs/releases/$TAG.md"
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }
          pre=""
          case "$TAG" in v0.*|*-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/* --target "$TARGET" --title "Meshtard ${TAG#v}" --notes-file "$notes" $pre
