# Toolbars of SketchUp 2026 (Windows), default workspace.
# DRAFT from memory. Check during the trial: which toolbars are visible on first start,
# where they are docked, button order, separators, flyouts, tooltip text.
#
# Each toolbar:
#   id       stable meshtard id
#   name     title shown in View > Toolbars
#   dock     "top", "left", "right" or "bottom"
#   row      order among toolbars on the same dock (0 = closest to the menu bar / window edge)
#   columns  buttons per row for toolbars docked left/right (Large Tool Set is two columns)
#   visible  shown in the default workspace
#   items    buttons and separators, in order
# Button: { id = command id from menus.toml, tooltip = "...", flyout = [ids] (optional) }.
# A flyout button shows the first id until the user picks another one from its list.
# Widget: { widget = "active_tag" | "shadow_date" | "shadow_time" | "measurements",
#           width = points when lying flat, tooltip = "..." (optional) }.
#
# The toolbars after the Large Tool Set are hidden by default and docked in row 1 of
# the top edge when shown (Measurements: the bottom edge; unverified). Button order and grouping are from memory;
# check against the trial's View > Toolbars (TRIAL_CHECKLIST.md).
verified = false

