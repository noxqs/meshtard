# Default shortcuts of SketchUp 2026 (Windows).
# DRAFT from memory. Replace with the real list: Window > Preferences > Shortcuts > Export.
verified = false

# Key syntax: modifiers joined with "+", in the order Ctrl, Shift, Alt. Keys use egui names.
# A command takes one key or a list of keys; menus show the first.
[bindings]
"file.new" = "Ctrl+N"
"file.open" = "Ctrl+O"
"file.save" = "Ctrl+S"
"file.print" = "Ctrl+P"
"edit.undo" = ["Ctrl+Z", "Alt+Backspace"]
"edit.redo" = "Ctrl+Y"
"edit.cut" = ["Ctrl+X", "Shift+Delete"]
"edit.copy" = ["Ctrl+C", "Ctrl+Insert"]
"edit.paste" = ["Ctrl+V", "Shift+Insert"]
"edit.delete" = "Delete"
"edit.select_all" = "Ctrl+A"
"edit.select_none" = "Ctrl+T"
"edit.invert_selection" = "Ctrl+Shift+I"
"edit.make_component" = "G"
"camera.orbit" = "O"
"camera.pan" = "H"
"camera.zoom" = "Z"
"camera.zoom_window" = "Ctrl+Shift+W"
"camera.zoom_extents" = ["Shift+Z", "Ctrl+Shift+E"]
"help.search" = "Shift+S"
"view.anim_previous" = "PageUp"
"view.anim_next" = "PageDown"
"tool.select" = "Space"
"tool.lasso" = "Shift+Space"
"tool.eraser" = "E"
"tool.paint_bucket" = "B"
"tool.line" = "L"
"tool.arc_2pt" = "A"
"tool.rectangle" = "R"
"tool.circle" = "C"
"tool.move" = "M"
"tool.rotate" = "Q"
"tool.scale" = "S"
"tool.push_pull" = "P"
"tool.offset" = "F"
"tool.tape_measure" = "T"
# Researched 2026-10-12 (spec/parity/SHORTCUTS.md has every key with its source):
# help.sketchup.com/en/default-keyboard-shortcuts (2026) [doc] confirms the tool keys
# above, Shift+Space, Shift+Z, G, Shift+S and adds K (Back Edges) and I (Image Igloo,
# no command yet); the File/Edit/Zoom Window/scene keys above match a Windows
# Preferences > Shortcuts export (forums.sketchup.com/t/36923, 2017) [inf].
# The second keys of Undo, Cut, Copy, Paste and Zoom Extents (Alt+Backspace,
# Shift+Delete, Ctrl+Insert, Shift+Insert, Ctrl+Shift+E) are from that export too [inf].
"view.back_edges" = "K"
# Sketchup/Context Help in that export [inf]; no menu item in SketchUp. Meshtard
# shows the Instructor panel for the active tool.
"help.context_help" = "Shift+F1"
# SketchUp 2026 for Windows binds these and does not let them change (forum reports
# forums.sketchup.com/t/341060 and /t/342241) [inf].
"file.exit" = "Ctrl+Q"
"window.preferences" = "Ctrl+Comma"
