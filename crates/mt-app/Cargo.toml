[package]
name = "mt-app"
description = "meshtard desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "meshtard"
path = "src/main.rs"

[dependencies]
mt-spec.workspace = true
mt-render.workspace = true
mt-skp.workspace = true
mt-kernel.workspace = true
mt-infer.workspace = true
mt-ui = { path = "../mt-ui" }
mt-cuda = { path = "../mt-cuda" }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
glam.workspace = true
image = { workspace = true, features = ["jpeg"] }
log.workspace = true
toml.workspace = true
env_logger.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# Build large models' pick index on the GPU (needs an NVIDIA driver at run time).
cuda = ["mt-cuda/cuda"]

[lints]
workspace = true
