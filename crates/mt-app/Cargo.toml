[package]
name = "mt-app"
description = "meshtard desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "meshtard"
path = "src/main.rs"

[dependencies]
mt-spec.workspace = true
mt-render.workspace = true
mt-skp.workspace = true
mt-kernel.workspace = true
mt-infer.workspace = true
mt-ui = { path = "../mt-ui" }
mt-cuda = { path = "../mt-cuda" }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
glam.workspace = true
image = { workspace = true, features = ["jpeg"] }
log.workspace = true
toml.workspace = true
serde.workspace = true
ttf-parser = "0.25"
# Bundled 3D Text fonts (Ubuntu Light, Hack): already built for egui.
epaint_default_fonts = "0.36"
env_logger.workspace = true
# Model library downloads (Window > Model Library): blocking HTTP on background
# threads, pure-Rust TLS (rustls) with the system's certificates.
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier", "gzip"] }
serde_json = "1"
# Extensions (Extensions > Extension Manager): the Rhai scripting language (sandboxed:
# no file or network access unless the app registers functions for it), .mtx
# packages (zip) and SHA-256 checks of Extension Warehouse downloads.
rhai = "1.23"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# Signed extension packages and catalogs (ed25519; BSD-3-Clause, pure Rust) and the
# random seed of `meshtard --extension-keygen`.
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }
getrandom = "0.3"
# Key slots of the kernel's entity ids (dense sets in Edit > Select All).
slotmap = "1"
# Comparing GPU vertices and segments byte for byte (`edge_view`).
bytemuck.workspace = true

[dev-dependencies]
# Mutation fuzzing of the .style and .mtx readers (src/fuzz_tests.rs).
mt-fuzz = { path = "../mt-fuzz" }
# The large-model benchmark (`src/bench.rs`): a headless wgpu device.
pollster.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
# Build large models' pick index on the GPU (needs an NVIDIA driver at run time).
cuda = ["mt-cuda/cuda"]

[lints]
workspace = true
