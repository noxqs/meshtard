[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT"
rust-version = "1.90"

[workspace.dependencies]
mt-spec = { path = "crates/mt-spec" }
mt-render = { path = "crates/mt-render" }
mt-skp = { path = "crates/mt-skp" }
mt-kernel = { path = "crates/mt-kernel" }
mt-infer = { path = "crates/mt-infer" }
mt-ui = { path = "crates/mt-ui" }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "wayland", "x11", "default_fonts"] }
egui = "0.36"
egui-wgpu = "0.36"
glam = "0.34"
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
log = "0.4"
env_logger = "0.11"
pollster = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
